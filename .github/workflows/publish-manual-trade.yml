name: Publish Manual Gold Trade

on:
  push:
    branches: [main]
    paths:
      - manual_trade.json

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate dynamic gold levels and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003819420479"
        run: |
          python - <<'PY'
          import json, math, os, urllib.parse, urllib.request
          from datetime import datetime, timezone

          ENTRY = 4147.0
          SIDE = "SELL"
          url = "https://query1.finance.yahoo.com/v8/finance/chart/GC%3DF?range=5d&interval=15m"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=25) as response:
              payload = json.loads(response.read().decode("utf-8"))

          result = payload.get("chart", {}).get("result")
          if not result:
              raise RuntimeError("تعذر جلب بيانات الذهب GC=F من Yahoo Finance")
          item = result[0]
          timestamps = item.get("timestamp") or []
          quote = (item.get("indicators", {}).get("quote") or [{}])[0]
          highs, lows, closes = quote.get("high") or [], quote.get("low") or [], quote.get("close") or []
          candles = []
          for i, ts in enumerate(timestamps):
              try:
                  h, l, c = highs[i], lows[i], closes[i]
                  if h is not None and l is not None and c is not None:
                      candles.append((int(ts), float(h), float(l), float(c)))
              except (IndexError, TypeError, ValueError):
                  continue
          if len(candles) < 20:
              raise RuntimeError("بيانات 15 دقيقة غير كافية لحساب ATR")
          age = datetime.now(timezone.utc).timestamp() - candles[-1][0]
          if age < -60 or age > 30 * 60:
              raise RuntimeError(f"آخر شمعة قديمة أو غير صالحة؛ عمرها {int(age)} ثانية")

          true_ranges = []
          for i in range(1, len(candles)):
              _, high, low, _ = candles[i]
              prev_close = candles[i-1][3]
              true_ranges.append(max(high-low, abs(high-prev_close), abs(low-prev_close)))
          atr = sum(true_ranges[-14:]) / 14
          if not math.isfinite(atr) or atr <= 0:
              raise RuntimeError("قيمة ATR غير صالحة")

          risk = round(1.5 * atr, 2)
          stop = round(ENTRY + risk, 2)
          targets = [round(ENTRY-risk, 2), round(ENTRY-2*risk, 2), round(ENTRY-3*risk, 2)]
          current = item.get("meta", {}).get("regularMarketPrice")
          current_text = f"{float(current):.2f}" if isinstance(current, (int,float)) else "غير متاح"
          last_candle = datetime.fromtimestamp(candles[-1][0], timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          msg = (
              "👑 <b>أسطورة المجال | صفقة ذهب معلّقة</b>\n\n"
              "🔴 <b>بيع XAUUSD</b>\n"
              "📌 نوع الدخول: <b>معلّق عند وصول السعر</b>\n"
              f"💰 الدخول: <code>{ENTRY:.2f}</code>\n"
              f"🛑 وقف الخسارة: <code>{stop:.2f}</code>\n"
              f"🎯 الهدف الأول TP1: <code>{targets[0]:.2f}</code>\n"
              f"🎯 الهدف الثاني TP2: <code>{targets[1]:.2f}</code>\n"
              f"🎯 الهدف الثالث TP3: <code>{targets[2]:.2f}</code>\n\n"
              f"📐 ATR(14): <code>{atr:.2f}</code> | المخاطرة: <code>{risk:.2f}</code>\n"
              f"📊 السعر الاسترشادي الحالي: <code>{current_text}</code>\n"
              f"🕯 آخر شمعة: <code>{last_candle}</code>\n\n"
              "⚠️ تم حساب الاستوب والأهداف آلياً من ATR على إطار 15 دقيقة، "
              "بنسبة عائد إلى مخاطرة 1:1 و1:2 و1:3. "
              "المصدر GC=F استرشادي وقد يختلف عن سعر XAUUSD لدى وسيطك؛ تحقق من السعر قبل التنفيذ."
          )
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["TELEGRAM_CHAT_ID"]
          body = urllib.parse.urlencode({"chat_id": chat, "text": msg, "parse_mode": "HTML", "disable_web_page_preview": "true"}).encode()
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=body,
              headers={"Content-Type": "application/x-www-form-urlencoded"}
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.loads(response.read().decode())
          if not result.get("ok"):
              raise RuntimeError(result.get("description", "Telegram send failed"))
          print("Telegram message sent; message_id=" + str(result["result"]["message_id"]))
          print(json.dumps({"entry": ENTRY, "stop_loss": stop, "take_profit_1": targets[0], "take_profit_2": targets[1], "take_profit_3": targets[2], "atr14": atr}))
          PY
