name: Gold Analysis and Telegram Signals

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "maintenance_notice.json"
      - "manual_quote.json"
      - "analyzer.py"

permissions:
  contents: write

concurrency:
  group: gold-pipeline
  cancel-in-progress: false

jobs:
  gold-pipeline:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Analyze latest gold data
        run: python analyzer.py

      - name: Send valid signals and monitor trades
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ""
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS || '-1003819420479' }}
        run: python telegram_notifier.py

      - name: Save signal and notifier state
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if ! git diff --quiet -- signal.json .telegram-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signal.json .telegram-state.json
            git commit -m "Update gold signal and Telegram state"
            git pull --rebase origin main
            git push
          fi

  manual-price-notice:
    if: >-
      github.event_name == 'push' &&
      (
        contains(github.event.head_commit.added, 'manual_quote.json') ||
        contains(github.event.head_commit.modified, 'manual_quote.json') ||
        contains(github.event.head_commit.removed, 'manual_quote.json')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate manual quote and send price only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-1003819420479' }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json, math, os
          from datetime import datetime, timezone

          with open("manual_quote.json", "r", encoding="utf-8") as f:
              quote = json.load(f)
          if quote.get("symbol") != "XAUUSD":
              raise SystemExit("رفض: الرمز يجب أن يكون XAUUSD")
          price = quote.get("price")
          if not isinstance(price, (int, float)) or isinstance(price, bool) or not math.isfinite(price) or price <= 0:
              print("لا يوجد سعر صالح؛ لم يتم إرسال أي رسالة.")
              raise SystemExit(0)

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
              event = json.load(f)
          stamp = event.get("head_commit", {}).get("timestamp")
          if not stamp:
              raise SystemExit("رفض: وقت تحديث الملف غير متوفر")
          committed = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
          age = (datetime.now(timezone.utc) - committed.astimezone(timezone.utc)).total_seconds()
          if age > 900 or age < -120:
              raise SystemExit("رفض: تحديث السعر أقدم من 15 دقيقة أو وقته غير صحيح")

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("إعدادات Telegram غير مكتملة في GitHub Secrets")
          import urllib.parse, urllib.request
          message = f"XAUUSD | {price:.2f} | إدخال يدوي من MT5 Weltrade"
          body = urllib.parse.urlencode({"chat_id": chat_id, "text": message}).encode()
          request = urllib.request.Request(
              "https://api.telegram.org/bot" + token + "/sendMessage",
              data=body,
              headers={"Content-Type": "application/x-www-form-urlencoded"}
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise SystemExit("Telegram رفض إرسال تحديث السعر")
          print("تم إرسال تحديث السعر اليدوي بنجاح.")
          PY

  maintenance-notice:
    if: >-
      github.event_name == 'push' &&
      (
        contains(github.event.head_commit.added, 'maintenance_notice.json') ||
        contains(github.event.head_commit.modified, 'maintenance_notice.json') ||
        contains(github.event.head_commit.removed, 'maintenance_notice.json')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Send maintenance notice through Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID || '-1003960644699' }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          with open("maintenance_notice.json", "r", encoding="utf-8") as f:
              paused = json.load(f).get("signals_paused") is True
          if paused:
              message = (
                  "👑 أسطورة المجال | إشعار هام\\n\\n"
                  "🛠️ البوت تحت الصيانة والتطوير حالياً.\\n"
                  "⛔ تم إيقاف صفقات البوت مؤقتاً حتى اكتمال التحديثات."
              )
          else:
              message = (
                  "👑 أسطورة المجال | عودة بوت الصفقات 🤖🥇\\n\\n"
                  "🟢 تم رفع إيقاف الصفقات واستئناف التحليل الآلي للذهب.\\n"
                  "📡 السعر استرشادي من عقود الذهب COMEX (GC=F)، وقد يختلف عن سعر Weltrade/MT5.\\n"
                  "⚠️ تحقق من السعر لدى وسيطك وإدارة المخاطر قبل التنفيذ."
              )
          body = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message,
              "disable_web_page_preview": "true"
          }).encode()
          req = urllib.request.Request(
              "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage",
              data=body,
              headers={"Content-Type": "application/x-www-form-urlencoded"}
          )
          with urllib.request.urlopen(req, timeout=25) as response:
              result = json.loads(response.read().decode())
          if not result.get("ok"):
              raise RuntimeError(result.get("description", "Telegram send failed"))
          print("Maintenance notice sent; message_id=" + str(result["result"]["message_id"]))
          PY
