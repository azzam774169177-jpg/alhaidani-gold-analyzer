name: Gold Analysis and Telegram Signals

on:
  push:
    paths:
      - "maintenance_notice.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-pipeline
  cancel-in-progress: false

jobs:
  gold-pipeline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Analyze latest gold data
        run: python analyzer.py

      - name: Send valid signals and monitor trades
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ""
          TELEGRAM_CHAT_IDS: "-1003819420479"
        run: python telegram_notifier.py

      - name: Save signal and notifier state
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if ! git diff --quiet -- signal.json .telegram-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signal.json .telegram-state.json
            git commit -m "Update gold signal and Telegram state"
            git pull --rebase origin main
            git push
          fi

  maintenance-notice:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send maintenance notice through Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1003819420479"
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          message = (
              "👑 أسطورة المجال | إشعار هام\n\n"
              "🛠️ البوت تحت الصيانة والتطوير حالياً.\n"
              "⛔ تم إيقاف صفقات البوت مؤقتاً حتى اكتمال التحديثات.\n"
              "يرجى عدم الاعتماد على أي إشارات آلية خلال فترة الصيانة.\n"
              "سنعلن لكم عند عودة البوت للعمل بإذن الله."
          )
          body = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message,
              "disable_web_page_preview": "true"
          }).encode()
          req = urllib.request.Request(
              "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage",
              data=body,
              headers={"Content-Type": "application/x-www-form-urlencoded"}
          )
          with urllib.request.urlopen(req, timeout=25) as response:
              result = json.loads(response.read().decode())
          if not result.get("ok"):
              raise RuntimeError(result.get("description", "Telegram send failed"))
          print("Maintenance notice sent; message_id=" + str(result["result"]["message_id"]))
          PY
