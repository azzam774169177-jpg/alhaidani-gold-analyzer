name: Gold Analysis and Telegram Signals

on:
  push:
    branches: [main]
    paths-ignore:
      - signal.json
      - .telegram-state.json
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-pipeline
  cancel-in-progress: false

jobs:
  gold-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Analyze latest gold data
        run: python analyzer.py

      - name: Send valid signals and monitor trades
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ""
          TELEGRAM_CHAT_IDS: "-1003819420479"
        run: python telegram_notifier.py

      - name: Save signal and notifier state
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if ! git diff --quiet -- signal.json .telegram-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signal.json .telegram-state.json
            git commit -m "Update gold signal and Telegram state"
            git pull --rebase origin main
            git push
          fi
